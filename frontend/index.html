<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:rgba(15,23,42,.86);--panel-solid:#111a2e;--line:rgba(148,163,184,.18);--text:#e5ecf6;--muted:#8fa0b8;--accent:#38bdf8;--danger:#ff3b3b;--chip:rgba(148,163,184,.12);--shadow:0 10px 30px rgba(0,0,0,.45);--halo:0 1px 5px rgba(0,0,0,.85)}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef2f7;--panel:rgba(255,255,255,.9);--panel-solid:#fff;--line:rgba(15,23,42,.12);--text:#0f172a;--muted:#5b6b82;--accent:#0284c7;--chip:rgba(15,23,42,.06);--shadow:0 10px 30px rgba(15,23,42,.18);--halo:0 1px 5px rgba(255,255,255,.95)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:absolute;inset:0;background:var(--bg)}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
button{font:inherit}
/* barra superior */
#top{position:absolute;z-index:1300;top:12px;left:12px;right:12px;height:52px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 10px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,59,59,.7)}70%,100%{box-shadow:0 0 0 10px rgba(255,59,59,0)}}
.spacer{flex:1}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--chip);color:var(--text);padding:7px 12px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:36px;height:36px;padding:0;font-size:18px}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--chip);font-size:12.5px;color:var(--muted);min-width:0}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liveDot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;flex:none}
.pill.off .liveDot{background:#ef4444;box-shadow:0 0 8px #ef4444}
#top{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;text-shadow:var(--halo);pointer-events:none}
#top>*{pointer-events:auto}
#top .btn{background:none;border-color:transparent}
#top .btn.icon{border-color:var(--line)}
#top .pill{background:none}
/* panel izquierdo */
#panel{position:absolute;z-index:1200;top:76px;left:12px;bottom:12px;width:330px;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s ease}
#panel.collapsed{transform:translateX(calc(-100% - 24px))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.stat{background:var(--chip);border-radius:12px;padding:8px 10px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:19px;white-space:nowrap}
.stat em{display:block;font-style:normal;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.tab{display:none;overflow:auto;padding:12px;flex:1}
.tab.on{display:block}
.group{margin-bottom:16px}
.group h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.group h4 b{color:var(--text);text-transform:none;letter-spacing:0;font-size:13px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:6px 4px;border-radius:8px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--accent);color:#04121d;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);padding:4px 10px;border-radius:999px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04121d;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=search]{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit}
#regions{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.rg{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.rg:hover{background:var(--chip)}
.rg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg em{font-style:normal;color:var(--muted);font-size:12px}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.panelFoot{padding:10px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.muted{color:var(--muted)}.pad{padding:12px}
/* lista */
.item{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;padding:8px 4px;cursor:pointer}
.item:hover,.item.sel{background:var(--chip)}
.item b{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#07101c;font-size:14px;flex:none}
.item span{display:flex;flex-direction:column;min-width:0}
.item strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted)}
.item.new{animation:flash 3s ease-out}
@keyframes flash{0%{background:rgba(255,59,59,.5)}100%{background:transparent}}
/* detalle */
#drawer{position:absolute;z-index:1250;top:76px;right:12px;bottom:12px;width:360px;border-radius:16px;overflow:auto;transition:transform .3s ease,opacity .3s}
#drawer.hidden{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.dHead{padding:16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line)}
.badge{min-width:68px;height:68px;border-radius:16px;display:grid;place-items:center;color:#07101c;font-weight:800;font-size:26px;line-height:1;text-align:center;flex:none}
.badge small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px}
.dHead h2{margin:0 0 4px;font-size:16px;line-height:1.3}
.dHead p{margin:0;color:var(--muted);font-size:12.5px}
.x{margin-left:auto;background:var(--chip);border:0;color:var(--text);width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none}
.dBody{padding:6px 16px 16px}
.dBody h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 4px}
.r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.r span{color:var(--muted)}
.r b{text-align:right;font-weight:600}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#07101c}
/* avisos y leyenda */
#toasts{position:absolute;z-index:1400;top:76px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;border:1px solid rgba(255,59,59,.55);background:var(--panel-solid);color:var(--text);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;animation:slideIn .35s ease-out}
.toast b{padding:4px 8px;border-radius:8px;color:#07101c;flex:none}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slideIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
#legend{position:absolute;z-index:1100;left:12px;bottom:12px;border-radius:12px;padding:8px 12px;font-size:12px;transition:left .3s}
body.panel-open #legend{left:354px}
#legend .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
.leaflet-right{transition:right .3s}
body.drawer-open .leaflet-right{right:384px}
/* animación de nuevo sismo */
.pulse{background:none;border:0}
.pulse .core{position:absolute;left:50%;top:50%;border-radius:50%;background:#ff2d2d;box-shadow:0 0 18px 6px rgba(255,45,45,.8);animation:corePop .7s ease-out}
.pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid #ff3b3b;background:radial-gradient(circle,rgba(255,59,59,.28),rgba(255,59,59,0) 70%);opacity:0;animation:ring 2.4s ease-out infinite}
.pulse i:nth-of-type(2){animation-delay:.8s}
.pulse i:nth-of-type(3){animation-delay:1.6s}
@keyframes ring{0%{transform:scale(.04);opacity:.95}100%{transform:scale(1);opacity:0}}
@keyframes corePop{0%{transform:scale(0)}55%{transform:scale(2.4)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pulse i{animation:none;opacity:.5;transform:scale(.4)}.brand .dot{animation:none}}
@media (max-width:700px){
  #panel{left:8px;right:8px;width:auto;top:68px;bottom:8px}
  #drawer{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:62vh}
  #drawer.hidden{transform:translateY(calc(100% + 24px))}
  body.drawer-open .leaflet-right{right:0}
  body.panel-open #legend{left:12px;display:none}
  #top{left:8px;right:8px;top:8px}
  #liveText{max-width:38vw}
  #soundBtn .tx{display:none}
}
#loader{position:fixed;inset:0;z-index:9999;background:#171c20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s ease,visibility .6s}
#loader.hide{opacity:0;visibility:hidden}
#loader img{width:min(60vmin,400px);height:auto;display:block}
#loader .bar{width:min(72vw,360px);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#38bdf8 55%,#ff5a1f)}
#loader .pct{font:600 22px/1 system-ui,sans-serif;color:#e5ecf6;font-variant-numeric:tabular-nums}
#loader p{margin:0;color:#8fa0b8;font:13px/1.4 system-ui,sans-serif;min-height:1.4em;text-align:center;padding:0 16px}
#loader button{margin-left:8px;border:1px solid #38bdf8;background:none;color:#38bdf8;border-radius:8px;padding:4px 10px;cursor:pointer}
</style>

<script>
(function(){
  var t=5,v=0,start=performance.now(),done=false,slow=false,
      bar=document.getElementById("lbar"),pct=document.getElementById("lpct"),msg=document.getElementById("lmsg"),root=document.getElementById("loader");
  window.__prog=function(p,m){if(p>t)t=Math.min(100,p);if(m&&!done)msg.textContent=m};
  window.__loadFail=function(){msg.innerHTML='No se pudo cargar el mapa. Revisa tu conexión.<button onclick="location.reload()">Reintentar</button>'};
  function frame(){
    if(done)return;
    var goal=t<100?Math.min(t+5,97):100;
    v+=(goal-v)*0.07;if(goal-v<0.1)v=goal;
    bar.style.width=v+"%";pct.textContent=Math.floor(v);
    var el=performance.now()-start;
    if(!slow&&el>15000&&t<100){slow=true;msg.textContent="Está tardando más de lo normal…"}
    if(t>=100&&v>=99.9&&el>1300){
      done=true;pct.textContent=100;bar.style.width="100%";
      setTimeout(function(){root.classList.add("hide");setTimeout(function(){root.remove()},800)},250);return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>

/* ---------- estado ---------- */

/* ---------- colores ---------- */
const DEPTH_STOPS=[[10,"#fde047","<10 km"],[35,"#fb923c","10–35"],[70,"#f472b6","35–70"],[150,"#a78bfa","70–150"],[300,"#60a5fa","150–300"],[Infinity,"#2dd4bf",">300 km"]];

function regionOf(place){
  if(!place)return"Desconocido";
  const i=place.lastIndexOf(", ");

  if(i>=0&&(/^[A-Z]{2}$/.test(r)||US.has(r)))r="United States";

}

/* ---------- datos ---------- */
async function getData(period,tier){
  if(window.API_URL){
    try{const r=await fetch(`${window.API_URL}/api/earthquakes?period=${period}&min_mag=${tier}`);if(r.ok)return await r.json()}catch(e){}
  }
  const r=await fetch(`${FEED}/${tier.toFixed(1)}_${period}.geojson`);
  if(!r.ok)throw new Error(r.status);
  return await r.json();
}
const norm=f=>{const p=f.properties||{},c=f.geometry.coordinates;return{source:p.source||"USGS",id:f.id,mag:p.mag??0,place:p.place||"Ubicación desconocida",time:p.time,updated:p.updated,lat:c[1],lon:c[0],depth:c[2]??0,p,region:regionOf(p.place)}};

async function load({force=false}={}){
  if(S.loading)return;S.loading=true;
  const need=tierFor(F.minMag);
  const tier=(S.tier!=null&&need>S.tier&&S.loadedPeriod===S.period)?S.tier:need;
  const reset=force||tier!==S.tier||S.period!==S.loadedPeriod;
  try{
    const d=await getData(S.period,tier);
    const res={feats:d.features,source:d.metadata?d.metadata.source:"direct"};
    const list=res.feats.filter(f=>f.geometry&&f.properties).map(norm).sort((a,b)=>b.time-a.time);
    const now=Date.now();
    const fresh=reset?list.filter(q=>now-q.time<=RECENT_MS):list.filter(q=>!S.seen.has(q.id)&&now-q.time<=FRESH_MAX_AGE);
    if(reset)S.seen=new Set();
    list.forEach(q=>S.seen.add(q.id));
    S.all=list;S.byId=new Map(list.map(q=>[q.id,q]));S.tier=tier;S.loadedPeriod=S.period;
    S.source=res.source;
    S.ok=true;setLive();
    announce(fresh.filter(q=>passes(q)));
    render();
    if(!S.hashDone){S.hashDone=true;const id=decodeURIComponent(location.hash.slice(1));if(id&&S.byId.has(id))select(id)}
  }catch(e){S.ok=false;setLive()}
  finally{
    S.loading=false;S.nextAt=Date.now()+POLL;
    if(!ready.data){ready.data=true;__prog(80,"Dibujando el mapa…");checkReady()}
  }
}

/* ---------- filtros ---------- */
function passes(q,skipRegion){
  if(q.mag<F.minMag)return false;
  const d=q.depth<70?"s":q.depth<=300?"i":"p";if(!F.depth.has(d))return false;
  if(!skipRegion&&F.regions.size&&!F.regions.has(q.region))return false;
  if(F.q&&!q.place.toLowerCase().includes(F.q)&&!q.region.toLowerCase().includes(F.q))return false;
  if(F.tsunami&&!q.p.tsunami)return false;
  if(F.felt&&!(q.p.felt>0))return false;
  if(F.inView&&!map.getBounds().contains([q.lat,q.lon]))return false;
  return true;
}

/* ---------- render ---------- */
function render(){
  const vis=S.all.filter(q=>passes(q));
  drawMarkers(vis);renderStats(vis);renderRegions();renderList(vis);renderLegend();
  $("#count").textContent=`${vis.length} de ${S.all.length} sismos`;
}
function renderStats(vis){
  const mx=vis.reduce((a,b)=>(!a||b.mag>a.mag)?b:a,null),last=vis[0];
  $("#stCount").textContent=vis.length.toLocaleString("es-CO");
  $("#stCountSub").textContent=S.period==="hour"?"última hora":S.period==="day"?"últimas 24 h":S.period==="week"?"últimos 7 días":"últimos 30 días";
  $("#stMax").textContent=mx?mx.mag.toFixed(1):"–";$("#stMaxSub").textContent=mx?mx.place:"\u00a0";
  $("#stLast").textContent=last?ago(last.time).replace("hace ",""):"–";$("#stLastSub").textContent=last?`M ${last.mag.toFixed(1)}`:"\u00a0";
}
function renderRegions(){
  const box=$("#regions"),top=box.scrollTop,counts=new Map();
  S.all.forEach(q=>{if(passes(q,true))counts.set(q.region,(counts.get(q.region)||0)+1)});
  F.regions.forEach(r=>{if(!counts.has(r))counts.set(r,0)});
  const rows=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"es"));
  box.innerHTML=rows.map(([r,n])=>`<label class="rg"><input type="checkbox" value="${esc(r)}" ${F.regions.has(r)?"checked":""}><span>${esc(r)}</span><em>${n}</em></label>`).join("")||`<p class="muted pad">Sin resultados</p>`;
  box.scrollTop=top;
}

}

/* ---------- alerta de sismo nuevo: pulso + sonido + aviso ---------- */
let actx=null,soundOn=true;
function unlock(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();actx.onstatechange=updateSoundBtn}catch(e){}}
  if(actx&&actx.state==="suspended")actx.resume().catch(()=>{});
  updateSoundBtn();
}
addEventListener("pointerdown",unlock);addEventListener("keydown",unlock);
function updateSoundBtn(){
  const running=actx&&actx.state==="running";
  const st=!soundOn?["🔇"," Silenciado"]:running?["🔊"," Sonido activo"]:["🔔"," Activar sonido"];
  $("#sIc").textContent=st[0];$("#sTx").textContent=st[1];
}
function ping(mag){
  if(!soundOn||!actx)return;
  const go=()=>{
    const reps=mag>=6?3:mag>=4.5?2:1,f=Math.max(260,1000-mag*95);
    for(let i=0;i<reps;i++){
      const t=actx.currentTime+i*.42,o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f/2,t+.6);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.28,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+1);
    }
  };
  if(actx.state==="running")go();else actx.resume().then(go).catch(()=>{});
}
function pulse(q){
  const s=Math.round(70+q.mag*28),c=Math.round(10+q.mag*2);
  const icon=L.divIcon({className:"pulse",iconSize:[s,s],iconAnchor:[s/2,s/2],
    html:`<span class="core" style="width:${c}px;height:${c}px;margin:${-c/2}px 0 0 ${-c/2}px"></span><i></i><i></i><i></i>`});
  const m=L.marker([q.lat,q.lon],{icon,interactive:false,keyboard:false,zIndexOffset:1000}).addTo(map);
  setTimeout(()=>map.removeLayer(m),9000);
  if($("#follow").checked)map.flyTo([q.lat,q.lon],Math.max(map.getZoom(),4),{duration:1.2});
}
function toast(html,id){
  const el=document.createElement("button");el.className="toast";el.innerHTML=html;
  el.onclick=()=>{if(id)select(id);el.remove()};
  $("#toasts").prepend(el);while($("#toasts").children.length>4)$("#toasts").lastChild.remove();
  setTimeout(()=>el.remove(),9000);
}
function announce(list,label){
  label=label||"Nuevo sismo";
  if(!list.length)return;
  list.slice(0,4).forEach((q,i)=>setTimeout(()=>{
    pulse(q);ping(q.mag);S.fresh.add(q.id);setTimeout(()=>S.fresh.delete(q.id),3500);
    toast(`<b style="background:${magColor(q.mag)}">M ${q.mag.toFixed(1)}</b><span>${label} · ${esc(q.place)}</span>`,q.id);
    renderList(S.all.filter(x=>passes(x)));
  },i*800));
  if(list.length>4)toast(`<b style="background:#94a3b8">+${list.length-4}</b><span>sismos nuevos más en la lista</span>`);
}
function replay(){
  const list=S.all.filter(q=>passes(q)).slice(0,3);
  if(!list.length)return;
  unlock();announce(list,"Reciente");
}

const debRender=debounce(render,80);
function magChanged(reload){F.minMag=Math.round(F.minMag*10)/10;syncUI();if(reload&&tierFor(F.minMag)<S.tier)load();else debRender()}

$("#togglePanel").onclick=()=>setPanel($("#panel").classList.contains("collapsed"));
$$(".tabs button").forEach(b=>b.onclick=()=>{$$(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$$(".tab").forEach(t=>t.classList.toggle("on",t.id==="tab-"+b.dataset.tab))});
$$("#segPeriod button").forEach(b=>b.onclick=()=>{S.period=b.dataset.v;syncUI();load({force:true})});
$$("#segColor button").forEach(b=>b.onclick=()=>{F.color=b.dataset.v;syncUI();render()});
$$("#segBase button").forEach(b=>b.onclick=()=>setBase(b.dataset.v));
$("#mag").oninput=e=>{F.minMag=+e.target.value;magChanged(false)};
$("#mag").onchange=()=>magChanged(true);
$$("#magChips .chip").forEach(c=>c.onclick=()=>{F.minMag=+c.dataset.v;magChanged(true)});
$$("#depthChips .chip").forEach(c=>c.onclick=()=>{const v=c.dataset.v;F.depth.has(v)?F.depth.delete(v):F.depth.add(v);syncUI();render()});
$("#q").oninput=e=>{F.q=e.target.value.trim().toLowerCase();debRender()};
$("#regions").onchange=e=>{const v=e.target.value;e.target.checked?F.regions.add(v):F.regions.delete(v);render()};
$("#clearRegions").onclick=()=>{F.regions.clear();render()};
$("#inView").onchange=e=>{F.inView=e.target.checked;render()};
$("#fTsu").onchange=e=>{F.tsunami=e.target.checked;render()};
$("#fFelt").onchange=e=>{F.felt=e.target.checked;render()};
$("#list").onclick=e=>{const b=e.target.closest(".item");if(b)select(b.dataset.id)};
$("#reset").onclick=()=>{Object.assign(F,{minMag:2.5,depth:new Set(["s","i","p"]),regions:new Set(),q:"",inView:false,tsunami:false,felt:false});syncUI();load({force:true})};
$("#soundBtn").onclick=()=>{
  if(!actx)unlock();
  if(actx&&actx.state!=="running"){soundOn=true;actx.resume().then(()=>{updateSoundBtn();ping(5)}).catch(()=>{});return}
  soundOn=!soundOn;updateSoundBtn();if(soundOn)ping(5);
};
$("#demo").onclick=replay;
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
map.on("moveend",()=>{if(F.inView)debRender()});
map.on("click",()=>{});

setPanel(innerWidth>700);syncUI();updateSoundBtn();load({force:true});
</script>
</body>
</html>
